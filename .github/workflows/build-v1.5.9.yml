name: Build wage calculator v1.5.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.5.9.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build selector-safe release
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('ghost-byte-wage-calculator-v1.5.8.user.js').read_text(encoding='utf-8')
          src=src.replace('// @version      1.5.8','// @version      1.5.9',1)
          src=src.replace("var ID='gb-wage-v158'","var ID='gb-wage-v159'",1)
          old="var link=node.querySelector&&node.querySelector('a[href*=\"XID=\"],a[href*=\"userID=\"],a[href*=\"profiles.php\"]');var href=link&&link.getAttribute('href')||'';"
          new="var link=null,links=node.querySelectorAll?node.querySelectorAll('a'):[];for(var q=0;q<links.length;q++){var candidate=links[q].getAttribute('href')||'';if(/(?:XID|userID)=\\d+|profiles\\.php/i.test(candidate)){link=links[q];break;}}var href=link&&link.getAttribute('href')||'';"
          if old not in src:
              raise SystemExit('Expected fragile selector was not found')
          src=src.replace(old,new,1)
          if 'a[href*=' in src:
              raise SystemExit('Fragile href substring selector remains')
          Path('ghost-byte-wage-calculator-v1.5.9.user.js').write_text(src,encoding='utf-8')
          Path('ghost-byte-wage-calculator.user.js').write_text(src,encoding='utf-8')
          PY
          node --check ghost-byte-wage-calculator-v1.5.9.user.js
          ! grep -F "a[href*=" ghost-byte-wage-calculator-v1.5.9.user.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.9.user.js ghost-byte-wage-calculator.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove invalid autofill selectors"
          git push
