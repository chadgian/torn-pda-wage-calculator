name: Build wage calculator v1.5.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.5.9.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build selector-safe release
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('ghost-byte-wage-calculator-v1.5.8.user.js').read_text(encoding='utf-8')
          src=src.replace('// @version      1.5.8','// @version      1.5.9',1)
          src=src.replace("var ID='gb-wage-v158'","var ID='gb-wage-v159'",1)

          helper="""function findEmployeeLink(box){var links=box&&box.querySelectorAll?box.querySelectorAll('a'):[];for(var i=0;i<links.length;i++){var href=links[i].getAttribute('href')||'';if(/(?:XID|userID)=\\d+|profiles\\.php/i.test(href))return links[i];}return null;}\nfunction hasEmployeeLink(box){return !!findEmployeeLink(box);}\n"""
          marker="function looksLikePayInput(i){"
          if marker not in src:
              raise SystemExit('looksLikePayInput marker missing')
          src=src.replace(marker,helper+marker,1)

          src=src.replace("!!box.querySelector('a[href*=\"XID=\"],a[href*=\"userID=\"],a[href*=\"profiles.php\"]')","hasEmployeeLink(box)")
          src=src.replace("var link=box.querySelector('a[href*=\"XID=\"],a[href*=\"userID=\"],a[href*=\"profiles.php\"]');","var link=findEmployeeLink(box);")
          src=src.replace("var id='',link=box.querySelector('a[href*=XID],a[href*=userID],a[href*=profiles\\.php]');","var id='',link=findEmployeeLink(box);")
          src=src.replace("var a=Array.from(document.querySelectorAll('a[href*=\"XID='+x.id+'\"],a[href*=\"userID='+x.id+'\"]')).filter(visible);","var a=Array.from(document.querySelectorAll('a')).filter(function(link){var href=link.getAttribute('href')||'';return visible(link)&&(href.indexOf('XID='+x.id)>=0||href.indexOf('userID='+x.id)>=0);});")

          if 'a[href*=' in src:
              raise SystemExit('Fragile href substring selector remains')
          Path('ghost-byte-wage-calculator-v1.5.9.user.js').write_text(src,encoding='utf-8')
          Path('ghost-byte-wage-calculator.user.js').write_text(src,encoding='utf-8')
          PY
          node --check ghost-byte-wage-calculator-v1.5.9.user.js
          ! grep -F "a[href*=" ghost-byte-wage-calculator-v1.5.9.user.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.9.user.js ghost-byte-wage-calculator.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove invalid autofill selectors"
          git push
