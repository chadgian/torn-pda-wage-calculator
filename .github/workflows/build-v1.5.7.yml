name: Build wage calculator v1.5.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.5.7.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build employee-first autofill release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ghost-byte-wage-calculator-v1.5.6.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      1.5.6','// @version      1.5.7',1)
          s=s.replace("var ID='gb-wage-v156'","var ID='gb-wage-v157'",1)
          old="function fillClickedInput(i){if(!cfg.fill)return false;var x=employeeForInput(i);if(!x)return false;selected=x.id;return fillInput(i,x);}"
          new="function employeeFromNode(t){if(!t||!rows.length)return null;var box=t.closest&&t.closest('tr,li,[data-user-id],[data-userid],[class*=employee i],[class*=staff i],[class*=worker i],[class*=row i],[role=row],[role=dialog],form');if(!box)return null;var id='',link=box.querySelector('a[href*=XID],a[href*=userID],a[href*=profiles\\.php]');if(link){try{var u=new URL(link.href,location.href);id=u.searchParams.get('XID')||u.searchParams.get('userID')||'';}catch(e){}}id=id||box.getAttribute('data-user-id')||box.getAttribute('data-userid')||box.getAttribute('data-id')||'';if(id){var byId=rows.find(function(x){return x.id===String(id);});if(byId)return byId;}var text=(box.textContent||'').toLowerCase();return rows.find(function(x){return x.name&&text.indexOf(x.name.toLowerCase())>=0;})||null;}\nfunction fillClickedInput(i){if(!cfg.fill)return false;var x=employeeForInput(i)||rows.find(function(z){return z.id===selected;});if(!x)return false;selected=x.id;return fillInput(i,x);}"
          if old not in s: raise SystemExit('fillClickedInput anchor missing')
          s=s.replace(old,new,1)
          old2="function handlePayTarget(target){var i=target&&target.closest?target.closest('input'):null;if(!cfg.fill||!looksLikePayInput(i))return;setTimeout(function(){fillClickedInput(i);},20);setTimeout(function(){fillClickedInput(i);},180);}"
          new2="function handlePayTarget(target){if(!cfg.fill)return;var x=employeeFromNode(target);if(x)selected=x.id;var i=target&&target.closest?target.closest('input'):null;if(i&&looksLikePayInput(i)){setTimeout(function(){fillClickedInput(i);},20);setTimeout(function(){fillClickedInput(i);},180);setTimeout(function(){fillClickedInput(i);},500);}else if(x){var tries=0,timer=setInterval(function(){if(fill()||++tries>25)clearInterval(timer);},120);}}"
          if old2 not in s: raise SystemExit('handlePayTarget anchor missing')
          s=s.replace(old2,new2,1)
          Path('ghost-byte-wage-calculator-v1.5.7.user.js').write_text(s,encoding='utf-8')
          main=s.replace('// @match        https://torn.com/companies.php*\n','// @match        https://torn.com/companies.php*\n// @updateURL    https://raw.githubusercontent.com/chadgian/torn-pda-wage-calculator/main/ghost-byte-wage-calculator.user.js\n// @downloadURL  https://raw.githubusercontent.com/chadgian/torn-pda-wage-calculator/main/ghost-byte-wage-calculator.user.js\n',1)
          Path('ghost-byte-wage-calculator.user.js').write_text(main,encoding='utf-8')
          PY
          node --check ghost-byte-wage-calculator-v1.5.7.user.js
          node --check ghost-byte-wage-calculator.user.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.7.user.js ghost-byte-wage-calculator.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remember employee before Torn opens pay editor"
          git push
