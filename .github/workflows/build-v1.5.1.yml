name: Build wage calculator v1.5.1

on:
  push:
    branches: [main]
    paths:
      - 'build/v1.5.1.part*.b64'
      - '.github/workflows/build-v1.5.1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate userscript
        run: |
          cat build/v1.5.1.part*.b64 | base64 --decode > ghost-byte-wage-calculator-v1.5.1.user.js
          node --check ghost-byte-wage-calculator-v1.5.1.user.js
          python3 -c "from pathlib import Path; s=Path('ghost-byte-wage-calculator-v1.5.1.user.js').read_text(); assert not any(c in s for c in '“”‘’')"
      - name: Commit generated userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.1.user.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build wage calculator v1.5.1"
          git push
