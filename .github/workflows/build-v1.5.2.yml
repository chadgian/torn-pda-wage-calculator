name: Build wage calculator v1.5.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.5.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected self-contained userscript
        run: |
          cp ghost-byte-wage-calculator-v1.5.1.user.js ghost-byte-wage-calculator-v1.5.2.user.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ghost-byte-wage-calculator-v1.5.2.user.js')
          s = p.read_text()
          s = s.replace('// @version      1.5.1', '// @version      1.5.2', 1)
          old = "var ID='gb-wage-v151',PDA_KEY='###PDA-APIKEY###',PFX=ID+':',staff=[],rows=[],selected='',busy=false;"
          new = "var ID='gb-wage-v152',PDA_KEY='###PDA-APIKEY###',PFX=ID+':',staff=[],rows=[],selected='',busy=false,settingsOpen=false;"
          if old not in s:
              raise SystemExit('Expected v1.5.1 declaration was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check ghost-byte-wage-calculator-v1.5.2.user.js
          grep -q "settingsOpen=false" ghost-byte-wage-calculator-v1.5.2.user.js
      - name: Commit generated userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.2.user.js
          git commit -m "Fix blank calculator panel in v1.5.2"
          git push
