name: Test Torn Company Helper

on:
  pull_request:
    paths:
      - 'torn-company-helper.user.js'
      - 'tests/company-changes.test.js'
      - 'tests/support-role-optimizer.test.js'
      - '.github/workflows/test-company-changes.yml'
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'torn-company-helper.user.js'
      - 'tests/company-changes.test.js'
      - 'tests/support-role-optimizer.test.js'
      - '.github/workflows/test-company-changes.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check userscript syntax
        run: node --check torn-company-helper.user.js
      - name: Run Torn Company Helper unit tests
        run: node --test tests/*.test.js
