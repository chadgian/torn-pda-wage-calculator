name: Publish stable userscript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-stable-userscript.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish canonical updateable file
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('ghost-byte-wage-calculator-v1.5.6.user.js')
          target = Path('ghost-byte-wage-calculator.user.js')
          text = source.read_text(encoding='utf-8')

          update_url = 'https://raw.githubusercontent.com/chadgian/torn-pda-wage-calculator/main/ghost-byte-wage-calculator.user.js'
          metadata = (
              f'// @updateURL    {update_url}\n'
              f'// @downloadURL  {update_url}\n'
          )

          marker = '// @run-at       document-end\n'
          if marker not in text:
              raise SystemExit('Could not find userscript metadata insertion point')
          text = text.replace(marker, metadata + marker, 1)
          target.write_text(text, encoding='utf-8')
          PY
          node --check ghost-byte-wage-calculator.user.js
      - name: Commit stable file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish stable updateable userscript"
          git push
