name: Build wage calculator v1.5.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.5.3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scoped and scrollable userscript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ghost-byte-wage-calculator-v1.5.2.user.js')
          s=p.read_text()
          s=s.replace('// @version      1.5.2','// @version      1.5.3')
          s=s.replace('// @match        https://www.torn.com/*\n// @match        https://torn.com/*','// @match        https://www.torn.com/companies.php*\n// @match        https://torn.com/companies.php*')
          s=s.replace("var ID='gb-wage-v152'", "var ID='gb-wage-v153'")
          s=s.replace("'use strict';\nvar ID=", "'use strict';\nif(location.pathname!=='/companies.php'||new URLSearchParams(location.search).get('step')!=='your')return;\nvar ID=")
          old=".wrap{overflow:auto;padding:0 12px 15px}table{width:100%;min-width:1100px;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid #444;white-space:nowrap;text-align:right}th{background:#07090b;position:sticky;top:0}th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}td{background:#171c21}tr:nth-child(even) td{background:#101418}a{color:#8bd1ff;font-weight:700}.omit{opacity:.6}.up{color:#8af0b1}.down{color:#ff9b9b}"
          new=".wrap{display:block;width:100%;max-width:100vw;overflow-x:auto!important;overflow-y:hidden;padding:0 12px 18px;box-sizing:border-box;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}.wrap::-webkit-scrollbar{height:12px}.wrap::-webkit-scrollbar-track{background:#080a0c}.wrap::-webkit-scrollbar-thumb{background:#71808d;border:2px solid #080a0c;border-radius:999px}table{width:max-content!important;min-width:1200px;border-collapse:collapse;color:#f7f9fb;background:#171c21}th,td{padding:9px 8px;border-bottom:1px solid #5b6570;white-space:nowrap;text-align:right;color:#f7f9fb!important}th{background:#050607!important;color:#ffffff!important;position:sticky;top:0;z-index:1}th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}td{background:#1c2228!important}tr:nth-child(even) td{background:#11161b!important}a{color:#9bd8ff!important;font-weight:800;text-decoration:underline}.omit td{opacity:.72}.up{color:#9ff3bd!important}.down{color:#ffaaaa!important}"
          if old not in s: raise SystemExit('table css target not found')
          s=s.replace(old,new)
          s=s.replace("#panel{max-width:1150px;margin:10px auto 40px;background:#15191d;border:1px solid #69737d;border-radius:12px;overflow:hidden}","#panel{width:min(1150px,100vw);max-width:100vw;margin:10px auto 40px;background:#15191d;color:#f7f9fb;border:1px solid #82909c;border-radius:12px;overflow:hidden;box-sizing:border-box}")
          s=s.replace("header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#080a0c}","header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#050607;color:#fff}")
          s=s.replace("header small{display:block;color:#ddd;margin-top:3px}","header small{display:block;color:#e7edf2;margin-top:3px}")
          s=s.replace("nav{display:flex;gap:7px;flex-wrap:wrap;padding:11px;background:#22272c}","nav{display:flex;gap:7px;flex-wrap:wrap;padding:11px;background:#20262c;color:#fff}")
          s=s.replace("button{border:1px solid #7e8993;border-radius:7px;padding:8px 10px;background:#343b42;color:#fff;font-weight:700}","button{border:1px solid #9aa7b3;border-radius:7px;padding:8px 10px;background:#36414b;color:#fff!important;font-weight:800}")
          s=s.replace(".settings{display:none;padding:12px}",".settings{display:none;padding:12px;background:#171c21;color:#f7f9fb}")
          s=s.replace(".field input,.field select{width:100%;box-sizing:border-box;padding:9px;background:#050607;color:#fff;border:1px solid #89939d;border-radius:7px}",".field input,.field select{width:100%;box-sizing:border-box;padding:9px;background:#ffffff!important;color:#111820!important;-webkit-text-fill-color:#111820!important;border:1px solid #aab5bf;border-radius:7px;opacity:1}")
          s=s.replace(".summary div{padding:10px;background:#272d33;border:1px solid #606b75;border-radius:8px}",".summary div{padding:10px;background:#242c33;border:1px solid #7b8995;border-radius:8px;color:#fff}")
          Path('ghost-byte-wage-calculator-v1.5.3.user.js').write_text(s)
          PY
          node --check ghost-byte-wage-calculator-v1.5.3.user.js
      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-byte-wage-calculator-v1.5.3.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build wage calculator v1.5.3"
          git push
